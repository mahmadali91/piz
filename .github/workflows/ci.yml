name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, zip, fileinfo

      - name: Lint PHP
        run: |
          set -e
          find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Ensure secrets are not committed
        run: |
          test ! -f config/config.php
          test ! -f info.txt

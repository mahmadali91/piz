<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#141821">
    <title>Нет соединения — ДОНЕР</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #fff1e8, transparent 55%), #f4f5f8;
            color: #151922;
        }
        .card {
            width: min(420px, 100%);
            background: #fff;
            border: 1px solid #e6e9ef;
            border-radius: 20px;
            box-shadow: 0 24px 60px -28px rgba(17, 24, 39, .4);
            padding: 30px 26px;
            text-align: center;
        }
        .mark {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            background: linear-gradient(145deg, #ff8b41, #f26b21);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 30px;
            font-weight: 800;
            margin: 0 auto 18px;
        }
        h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
        p { margin: 0 0 20px; color: #7b8494; font-size: 13.5px; line-height: 1.5; }
        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(180deg, #ff7d33, #f26b21);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">Д</div>
        <h1>Нет соединения</h1>
        <p>Проверьте интернет на телефоне. Данные, которые вы уже открывали, могут быть доступны, но новые продажи и остатки требуют связи с сервером.</p>
        <button type="button" onclick="location.reload()">Повторить</button>
    </div>
</body>
</html>
